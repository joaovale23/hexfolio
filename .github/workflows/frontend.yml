name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Testes (Vitest + Testing Library)
        run: npm test
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /hexfolio/
          # Endereço da API em produção: variável do repositório (Settings → Variables). Vazio = só a cópia estática.
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    # Publica no GitHub Pages só o que chega na main, depois dos testes.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
