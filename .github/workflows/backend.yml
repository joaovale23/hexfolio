name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # surefire roda os testes unitários e o ArchUnit; failsafe roda os *IT com Testcontainers (PostgreSQL + LocalStack)
      - name: Testes unitários, de arquitetura e de integração
        run: ./mvnw -B verify

      - name: Cobertura (JaCoCo)
        uses: actions/upload-artifact@v5
        with:
          name: cobertura
          path: backend/target/site/jacoco/

      - name: Imagem Docker
        run: docker build -t hexfolio-api:${{ github.sha }} .
