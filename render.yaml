# Blueprint do Render: a API do hexfolio no plano gratuito.
# Os valores com "sync: false" são segredos: o Render pede para preenchê-los no painel ao criar o serviço.
services:
  - type: web
    name: hexfolio-api
    runtime: docker
    plan: free
    region: virginia
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # 512 MB de RAM: coletor serial, pilhas menores e compilação mais leve para inicializar mais rápido.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
      - key: AWS_REGION
        value: us-east-1
      - key: CORS_ALLOWED_ORIGINS
        value: https://joaovale23.github.io
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CONTACT_FROM
        sync: false
      - key: CONTACT_NOTIFY_TO
        sync: false
