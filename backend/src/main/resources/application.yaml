spring:
  application:
    name: hexfolio
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
    servlet:
      # Inicializa o DispatcherServlet na subida, e não na primeira requisição.
      load-on-startup: 1
  docker:
    compose:
      enabled: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:sa-east-1}
      sqs:
        listener:
          # Espera longa: cada consulta à fila aguarda até 20 s por mensagens, o que reduz as requisições ao SQS.
          poll-timeout: 20s

server:
  port: ${PORT:8080}

hexfolio:
  queues:
    contact: hexfolio-contact
    contact-dlq: hexfolio-contact-dlq
    provision: false
    max-receive-count: 3
    visibility-timeout-seconds: 10
  contact:
    notify-to: ${CONTACT_NOTIFY_TO:dev@localhost}
    from: ${CONTACT_FROM:hexfolio@localhost}
    rate-limit-per-hour: 5
  trace:
    max-duration: 30s
    poll-interval: 150ms
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  architecture:
    source-base-url: https://github.com/joaovale23/hexfolio/blob/main/backend/src/main/java/

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # O e-mail é processado pela fila: uma falha no SMTP não deve derrubar o health check da API.
    mail:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      enabled: true
      file: compose.yaml
  cloud:
    aws:
      endpoint: http://localhost:4566
      credentials:
        access-key: test
        secret-key: test
      region:
        static: sa-east-1
hexfolio:
  queues:
    provision: true

---
# Produção (Render). Os segredos chegam por variáveis de ambiente configuradas no painel do Render.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
hexfolio:
  queues:
    visibility-timeout-seconds: 30
